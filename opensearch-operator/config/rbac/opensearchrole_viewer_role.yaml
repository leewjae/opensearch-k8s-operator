# permissions for end users to view opensearchroles.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opensearchrole-viewer-role
rules:
- apiGroups:
  - opster.opensearch.dremio.io
  resources:
  - opensearchroles
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - opster.opensearch.dremio.io
  resources:
  - opensearchroles/status
  verbs:
  - get
