# This kustomization.yaml is not intended to be run by itself,
# since it depends on service name and namespace that are out of this kustomize package.
# It should be run by config/default
resources:
- bases/opensearch.dremio.io_opensearchactiongroups.yaml
- bases/opensearch.dremio.io_opensearchclusters.yaml
- bases/opensearch.dremio.io_opensearchcomponenttemplates.yaml
- bases/opensearch.dremio.io_opensearchindextemplates.yaml
- bases/opensearch.dremio.io_opensearchroles.yaml
- bases/opensearch.dremio.io_opensearchtenants.yaml
- bases/opensearch.dremio.io_opensearchuserrolebindings.yaml
