#- path: patches/webhook_in_opensearchsnapshotpolicies.yaml
#- path: patches/webhook_in_opensearchindextemplates.yaml
#- path: patches/webhook_in_opensearchcomponenttemplates.yaml
#+kubebuilder:scaffold:crdkustomizewebhookpatch

# [CERTMANAGER] To enable webhook, uncomment all the sections with [CERTMANAGER] prefix.
# patches here are for enabling the CA injection for each CRD
- path: patches/cainjection_in_opensearch.yaml
- path: patches/cainjection_in_opensearchusers.yaml
- path: patches/cainjection_in_opensearchroles.yaml
- path: patches/cainjection_in_opensearchuserrolebindings.yaml
- path: patches/cainjection_in_opensearchtenants.yaml
- path: patches/cainjection_in_opensearchactiongroups.yaml
