jobs:
  setup-env:
    outputs:
      tag: ${{ steps.env.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - id: env
        name: Set up environment
        run: |
          opensearch_operator_version="2.7.0"

          head_sha=$(git rev-parse --short HEAD)
          timestamp=$(date -u +"%Y%m%d%H%M%S")

          tag="${opensearch_operator_version}-dremio-${timestamp}-${head_sha}"

          echo "tag=$tag" | tee -a "$GITHUB_OUTPUT"
        shell: bash

  docker:
    needs:
      - setup-env
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - id: google-auth
        name: Google auth
        uses: google-github-actions/auth@v2
        with:
          service_account: ${{ vars.GCP_DREMIO_1093_REGISTRY_SERVICE_ACCOUNT }}
          token_format: access_token
          workload_identity_provider: ${{ vars.GCP_DREMIO_1093_WORKLOAD_IDENTITY_PROVIDER }}
      - name: Docker auth
        id: docker-auth
        uses: docker/login-action@v2
        with:
          password: ${{ steps.google-auth.outputs.access_token }}
          registry: ${{ vars.GCP_DREMIO_1093_US_WEST1_REGISTRY }}
          username: oauth2accesstoken
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: opensearch-operator
          file: opensearch-operator/Dockerfile
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: ${{ vars.GCP_DREMIO_1093_US_WEST1_IMAGE_REPOSITORY }}:${{ needs.setup-env.outputs.tag }}

  helm:
    needs:
      - setup-env
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
      - id: google-auth
        name: Google auth
        uses: google-github-actions/auth@v2
        with:
          service_account: ${{ vars.GCP_DREMIO_1093_REGISTRY_SERVICE_ACCOUNT }}
          token_format: access_token
          workload_identity_provider: ${{ vars.GCP_DREMIO_1093_WORKLOAD_IDENTITY_PROVIDER }}
      - name: Docker auth
        id: docker-auth
        uses: docker/login-action@v1
        with:
          password: ${{ steps.google-auth.outputs.access_token }}
          registry: ${{ vars.GCP_DREMIO_1093_US_WEST1_REGISTRY }}
          username: oauth2accesstoken
      - name: Make sure helm chart has correct versions
        run: |
          sed -i -e 's/^appVersion:.*/appVersion: '${{ needs.setup-env.outputs.tag }}'/' charts/opensearch-operator/Chart.yaml
          sed -i -e 's/^version:.*/version: '${{ needs.setup-env.outputs.tag }}'/' charts/opensearch-operator/Chart.yaml
        shell: bash
      - name: Package chart
        run: helm package charts/opensearch-operator --version ${{ needs.setup-env.outputs.tag }}
        shell: bash
      - if: github.event_name == 'workflow_dispatch'
        name: Publish chart
        run: |
          helm \
            push \
            dremio-opensearch-operator-helm-${{ needs.setup-env.outputs.tag }}.tgz \
            ${{ vars.GCP_DREMIO_1093_US_WEST1_HELM_REPOSITORY }}
        shell: bash

  tag:
    if: github.event_name == 'workflow_dispatch'
    needs:
      - setup-env
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Tag version in Git
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git tag ${{ needs.setup-env.outputs.tag }}
          git push origin ${{ needs.setup-env.outputs.tag }}
        shell: bash

name: Build and push OpenSearch operator image and helm chart

on:
  push:
  workflow_dispatch:
